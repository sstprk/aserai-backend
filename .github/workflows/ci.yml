name: CI

# Backend repo. The project is at the repository root here, so there is no
# working-directory and the lockfile path is plain `package-lock.json`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `cache: npm` keys off package-lock.json and needs no extra setup, unlike
      # the Yarn 4 route this project never actually used: the committed
      # yarn.lock was Yarn 1 format, so `yarn install --immutable` had to
      # rewrite it and failed every run.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs strictly from the lockfile and fails if it disagrees
      # with package.json — a dependency change committed without its lockfile
      # update is caught here rather than at deploy time.
      - name: Install
        run: npm ci

      - name: Migration policy
        run: npm run lint:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Build
        run: npm run build
